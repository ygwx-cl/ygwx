<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>长乐家电维修客服</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei}
body{background:#f4f7f9}
/*悬浮客服按钮*/
.float-btn{
    position:fixed;right:30px;bottom:30px;
    width:56px;height:56px;border-radius:50%;
    background:#1677ff;color:#fff;font-size:24px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 15px rgba(22,119,255,0.35);
    cursor:pointer;z-index:9999;
}
/*聊天窗口*/
.chat-box{
    position:fixed;right:30px;bottom:95px;
    width:420px;height:620px;background:#fff;
    border-radius:16px;box-shadow:0 6px 30px rgba(0,0,0,0.12);
    display:none;flex-direction:column;z-index:9998;overflow:hidden;
}
.chat-header{
    background:#1677ff;color:#fff;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:center;
}
.chat-body{
    flex:1;padding:16px;overflow-y:auto;background:#fafbfc;
}
.msg-left{
    display:flex;margin-bottom:16px;justify-content:flex-start;
}
.msg-right{
    display:flex;margin-bottom:16px;justify-content:flex-end;
}
.msg-text-left{
    background:#e8edf3;color:#222;padding:9px 14px;
    border-radius:12px 12px 12px 4px;max-width:72%;font-size:14px;
    line-height:1.65;
}
.msg-text-right{
    background:#1677ff;color:#fff;padding:9px 14px;
    border-radius:12px 12px 4px 12px;max-width:72%;font-size:14px;
    line-height:1.65;
}
.quick-area{
    padding:10px 16px;border-top:1px solid #eee;display:flex;flex-wrap:wrap;gap:8px;
}
.quick-tag{
    border:1px solid #1677ff;color:#1677ff;padding:4px 12px;
    border-radius:20px;font-size:13px;cursor:pointer;
}
.input-area{
    padding:12px 16px;border-top:1px solid #eee;display:flex;gap:8px;
}
#txt{
    flex:1;border:1px solid #ddd;border-radius:24px;padding:10px 16px;outline:none;
}
#send{
    background:#1677ff;color:#fff;border:none;border-radius:24px;padding:0 18px;cursor:pointer;
}
.close{cursor:pointer;font-size:20px;}
/*移动端适配*/
@media(max-width:480px){
    .chat-box{width:calc(100% - 20px);height:85vh;right:10px;}
    .float-btn{right:15px;bottom:20px;}
}
</style>
</head>
<body>

<div class="float-btn" id="openBtn">💬</div>

<div class="chat-box" id="chatWin">
    <div class="chat-header">
        <div>家电维修智能客服 | 长乐本地</div>
        <div class="close" id="closeBtn">×</div>
    </div>
    <div class="chat-body" id="content">
        <div class="msg-left">
            <div class="msg-text-left">您好！欢迎咨询空调洗衣机清洗、电脑打印机上门维修服务~</div>
        </div>
    </div>
    <div class="quick-area">
        <div class="quick-tag" onclick="sendMsg('空调清洗价格')">空调清洗报价</div>
        <div class="quick-tag" onclick="sendMsg('洗衣机清洗')">洗衣机清洗</div>
        <div class="quick-tag" onclick="sendMsg('电脑打印机维修')">办公设备维修</div>
        <div class="quick-tag" onclick="sendMsg('上门时间')">预约营业时间</div>
    </div>
    <div class="input-area">
        <input type="text" id="txt" placeholder="输入问题">
        <button id="send" onclick="submit()">发送</button>
    </div>
</div>

<script>
//开关窗口
const openBtn = document.getElementById('openBtn');
const closeBtn = document.getElementById('closeBtn');
const chatWin = document.getElementById('chatWin');
const content = document.getElementById('content');
const txt = document.getElementById('txt');

openBtn.onclick = ()=> chatWin.style.display = 'flex';
closeBtn.onclick = ()=> chatWin.style.display = 'none';

//问答库
const qa = {
    "空调清洗价格":"挂机空调80元/台，柜机120元，深度拆机清洗除菌，长乐全区上门",
    "洗衣机清洗":"波轮70元，滚筒90元，全拆内筒去除污垢霉菌",
    "电脑打印机维修":"电脑重装系统、卡顿、打印机卡纸缺墨均可检修，先检测后收费",
    "上门时间":"每日8:30-21:00可预约，周末节假日正常接单",
    "你好":"您好😊，长乐家电维保师傅为您服务",
    "谢谢":"不客气，需要预约随时说~"
};

//快捷发送
function sendMsg(word){
    txt.value = word;
    submit();
}

//追加消息
function addText(text,isUser){
    let div = document.createElement('div');
    if(isUser){
        div.className = 'msg-right';
        div.innerHTML = `<div class="msg-text-right">${text}</div>`;
    }else{
        div.className = 'msg-left';
        div.innerHTML = `<div class="msg-text-left">${text}</div>`;
    }
    content.appendChild(div);
    content.scrollTop = content.scrollHeight;
}

//发送消息
function submit(){
    let val = txt.value.trim();
    if(!val) return;
    addText(val,true);
    txt.value = '';
    setTimeout(()=>{
        let res = qa[val] || "暂时没看懂你的问题，可以点击上方快捷选项提问";
        addText(res,false);
    },600);
}

//回车发送
txt.onkeydown = e=>{
    if(e.key === 'Enter') submit();
}
</script>
</body>
</html>
